# descriptors.yaml — frozen level descriptors (law; Art. III)
#
# Every can-do below is checkable by executing Python files and the tests
# that exercise them. Nothing here may reference installers, environments,
# packaging or third-party frameworks: an agent planning against this law
# must never need to check anything beyond .py files and the tests that run
# them.

_meta:
  status: approved

python:
  1: >-
    Reads simple Python: variables, numbers and strings, if/else and loops,
    the built-in containers (list, dict, tuple, set), and text file I/O with
    the standard library. Modifies an existing single-file script to a stated
    behavior when told what to change; writes a short single-file script that
    reads input, transforms it, and prints the result.
  2: >-
    Completes a small correct program alone: idiomatic functions with type
    hints, comprehensions, exceptions with EAFP handling of messy input, and
    modules that other code imports. Implements functions to a written
    specification of name, arguments and return value; reads and fixes
    someone else's script until the provided checks pass.
  3: >-
    Builds a larger program out of several modules: classes with inheritance
    and dunder methods, generators and iterators, decorators and context
    managers, structured data (json, csv) and dates (datetime) from the
    standard library, and command-line arguments and flags (argparse).
    Refactors an existing multi-file program without changing its behavior,
    as shown by the same checks passing before and after.
  4: >-
    Fluent in the language core: structures code into modules with clear
    responsibilities and small interfaces; uses collections, itertools,
    functools, re and typing (including generics and protocols); handles
    binary data and text encodings; finds and fixes subtle bugs (shared
    mutability, closure scoping, off-by-one iteration) in code they did not
    write, confirmed by the provided checks.