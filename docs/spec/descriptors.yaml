# descriptors.yaml — frozen level descriptors (law; Art. III)
#
# MOCK VALUES (OD-12). Owner-authorized placeholders so the build can start.
# The owner replaces them with real law BEFORE the W1 gate, then sets
# _meta.status to "approved". Tooling must refuse to treat a "mock" file as
# approved law (the W1 gate "init on python -> sane curriculum" needs real text).

_meta:
  status: approved            # mock | approved

python:
  1: >-
    Reads Python: variables, control flow, basic data structures (lists, dicts,
    tuples, sets), and file I/O. Modifies an existing script to a stated
    behavior when told what to change; writes a short single-file script that
    reads input, transforms it, and prints output. Cannot structure a project
    alone.
  2: >-
    Ships a small tested program alone: idiomatic functions and comprehensions;
    exceptions with EAFP handling of messy input; a CLI that accepts arguments
    and flags (argparse); a pytest suite with fixtures; packaging via pyproject,
    installable and runnable with uv; reads and fixes someone else's script
    against provided tests.
